# Runs the alpha miner on GitHub's servers around the clock — no local PC needed.
#
# A job may run at most 6 hours, so a run starts every 6 hours and mines for ~5.5 hours
# (MINER_MINUTES). Each run decrypts the saved state, mines, re-encrypts it into
# miner_state.enc and commits it, so the next run resumes exactly where this one stopped.
# The repository is public: formulas never appear in logs, issues or plain files.
name: alpha-miner

on:
  schedule:
    - cron: "7 */6 * * *"    # 00:07, 06:07, 12:07, 18:07 UTC
  workflow_dispatch:
    inputs:
      minutes:
        description: "How many minutes to mine"
        default: "320"

permissions:
  contents: write   # commit the encrypted progress
  issues: write     # announce new alphas

concurrency:
  group: alpha-miner
  cancel-in-progress: false

jobs:
  mine:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    env:
      BRAIN_EMAIL: ${{ secrets.BRAIN_EMAIL }}
      BRAIN_PASSWORD: ${{ secrets.BRAIN_PASSWORD }}
      MINER_STATE_KEY: ${{ secrets.MINER_STATE_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      # Always the newest main, not the commit that triggered the run: a queued scheduled run would
      # otherwise restore stale progress from before the previous run saved.
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Restore progress
        run: python vault.py unpack

      - name: Mine alphas
        env:
          MINER_MINUTES: ${{ inputs.minutes || vars.MINER_MINUTES || '320' }}
          MINER_MAX_SIMS_PER_DAY: ${{ vars.MINER_MAX_SIMS_PER_DAY || '600' }}
          # Automatic submission: set the repository variable MINER_AUTO_SUBMIT to "off" to stop it.
          MINER_AUTO_SUBMIT: ${{ vars.MINER_AUTO_SUBMIT || 'on' }}
          MINER_SUBMITS_PER_DAY: ${{ vars.MINER_SUBMITS_PER_DAY || '5' }}
          MINER_AUTO_MIN_FITNESS: ${{ vars.MINER_AUTO_MIN_FITNESS || '1.2' }}
        run: python miner.py

      - name: Save progress
        if: always()
        # Only this workflow writes miner_state.enc (one run at a time), so this run's state always wins:
        # commit it on top of the newest main instead of rebasing, which can't conflict.
        run: |
          python vault.py pack
          cp miner_state.enc "$RUNNER_TEMP/state.enc"
          git config user.name "alpha-miner[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch -q origin main
            git checkout -q -f origin/main
            cp "$RUNNER_TEMP/state.enc" miner_state.enc
            git add miner_state.enc
            git diff --cached --quiet && break
            git commit -q -m "miner: progress $(date -u '+%Y-%m-%d %H:%M') UTC"
            git push -q origin HEAD:main && break
            sleep 5
          done

      - name: Alert on failure
        if: failure() || cancelled()
        run: >
          python notify.py send "🔴 Alpha miner run failed. Details:
          ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      - name: Announce new alphas
        if: always() && hashFiles('miner/new_ready.md') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "The miner found new alphas that pass every check, including correlation."
            echo "Open each Alpha ID on BRAIN (**Alphas → Unsubmitted**) and submit 1–2 per day."
            echo
            cat miner/new_ready.md
          } > body.md
          gh issue create --title "New alphas ready to submit ($(date -u '+%Y-%m-%d'))" --body-file body.md
